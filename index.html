<script>
const SONGS=[{"id": "hissha", "subj": "国語", "pub": "2026-10-15T01:01", "kind": "shorts", "title": "筆者の気持ち、知らんがな", "yt": "EO0m-1bJ2Qk", "th": "img/hissha_th.jpg", "bg": "img/hissha_bg.jpg", "qs": [{"q": "「40字以内で述べなさい」の問題で、41字書いたらどうなる？", "o": ["1字くらいならセーフ", "字数オーバーで減点（アウト）", "2字まではセーフ", "字数は関係ない"], "a": 1, "e": "「以内」は1字でもこえたらアウト。歌でも「41字でアウト！」。字数は必ず守ろう。"}, {"q": "マス目のある解答らんで、句読点（、。）はどう数える？", "o": ["数えない", "1字として数える", "2字として数える", "文の最後だけ数える"], "a": 1, "e": "句読点もかぎかっこも、1マスに1つ＝1字として数えるのがふつう。"}, {"q": "「理由を答えなさい」と聞かれたら、文の終わりは？", "o": ["〜から", "〜気持ち", "〜こと", "〜です"], "a": 0, "e": "理由は「〜から」で終わる。気持ちを聞かれたら「〜気持ち」で終わる。聞かれ方に合わせよう。"}, {"q": "「筆者の気持ち」を答えるとき、どこから言葉を取ってくる？", "o": ["自分の想像", "本文の言葉", "先生の説明", "友だちの答え"], "a": 1, "e": "本文から抜き出すのが基本。「勝手に作るな、あなたの意見は聞いてない」と歌にもあったね。"}, {"q": "字数が足りないとき、「とてもとてもとても」とくり返して字数をかせぐと？", "o": ["字数が足りればOK", "水増しはダメ。減点やバツ", "1回だけならOK", "むしろ気持ちが伝わる"], "a": 1, "e": "歌でも「水増しはバツです」。足りないときも減点。中身のある言葉で、ちょうどよい字数にしよう。"}], "checked": true}, {"id": "pump", "subj": "算数", "pub": "2026-10-15T01:01", "kind": "shorts", "title": "ポンプの前に蛇口をしめろ", "yt": "HH9cUJ7VtRI", "th": "img/pump_th.jpg", "bg": "img/pump_bg.jpg", "qs": [{"q": "「窓口に人が並び続け、窓口を増やしても行列がなくならない」問題は、どの特殊算？", "o": ["つるかめ算", "旅人算", "ニュートン算", "植木算"], "a": 2, "e": "並ぶ人が増え続けながら、さばいていく。水そうと同じ形だからニュートン算。"}, {"q": "「ニュートン算」はどんな問題？", "o": ["増え続けるものを、減らしていく問題", "止まっているものを分ける問題", "2人が出会う問題", "木を等間隔に植える問題"], "a": 0, "e": "蛇口から入り続ける水をポンプでくみ出す。並び続ける行列を窓口でさばく。「入る」と「出す」のつなひきがニュートン算。"}, {"q": "ニュートン算で、はじめに求めることが多いのは？", "o": ["1分間に増える量", "ポンプの値段", "水そうの色", "さいごに残る量"], "a": 0, "e": "まず「1分間にどれだけ入ってくるか」を出す。それが分かれば、ポンプ何台で何分かが計算できる。"}, {"q": "「ニュートン算」の名前のもとになった人は？", "o": ["エジソン", "ニュートン", "ガリレオ", "アインシュタイン"], "a": 1, "e": "りんごで有名なニュートンが考えた「牛が草を食べる」問題がもと。歌でも「りんご食べてる場合じゃない」！"}, {"q": "蛇口から水が入り続ける水そう。ポンプ1台なら30分、2台なら10分で空になる。3台なら何分？", "o": ["6分", "5分", "3分", "15分"], "a": 0, "e": "ポンプ1台が1分にくみ出す量を2とする。1台30分では2×30＝60、2台10分では4×10＝40くみ出した。ちがいの20は、時間の差20分に入った水なので、1分に入る水は1。はじめの水は60−30＝30。3台なら1分に6−1＝5へるので、30÷5＝6分。"}], "checked": true}, {"id": "tsuki", "subj": "理科", "pub": "2026-10-15T01:01", "kind": "shorts", "title": "上弦、下弦、私の記憶はいい加減", "yt": "aYC7HtpCgrE", "th": "img/tsuki_th.jpg", "bg": "img/tsuki_bg.jpg", "qs": [{"q": "夕方、南の空に見える半月は？", "o": ["上弦の月", "下弦の月", "新月", "満月"], "a": 0, "e": "夕方に南の空、右側が光っている半月が上弦の月。歌では「夕方南にいるのは上弦」。"}, {"q": "明け方、南の空に見える半月は？", "o": ["上弦の月", "下弦の月", "三日月", "満月"], "a": 1, "e": "明け方に南の空にあるのは下弦の月。左側が光っているよ。"}, {"q": "月の満ち欠けがひとまわりする日数は？", "o": ["約7日", "約15日", "約29.5日", "約365日"], "a": 2, "e": "新月から次の新月まで約29.5日。歌の「29日と半日」だね。"}, {"q": "新月→三日月→上弦→満月。満月の次は？", "o": ["新月", "上弦", "下弦", "三日月"], "a": 2, "e": "満月のあとは下弦の月になって、やがて新月にもどる。"}, {"q": "月が欠けて見えるのはなぜ？", "o": ["地球の影に入るから", "太陽に照らされている部分の見え方が変わるから", "雲がかかるから", "月が小さくなるから"], "a": 1, "e": "地球の影で欠けるのは「月食」。ふだんの満ち欠けは、太陽の光が当たっている部分がどう見えるかで変わる。歌の子もここで×をもらった。"}], "checked": true}, {"id": "tsurukame", "subj": "算数", "pub": "2026-10-15T01:01", "kind": "shorts", "title": "つるかめ戦争、わたしは焦燥", "yt": "xFwHOp3QEjs", "th": "img/tsurukame_th.jpg", "bg": "img/tsurukame_bg.jpg", "qs": [{"q": "鶴と亀が合わせて20匹、足は全部で56本。亀は何匹？", "o": ["6匹", "8匹", "10匹", "12匹"], "a": 1, "e": "全部鶴なら足は40本。56−40＝16本多い。亀は鶴より足が2本多いので、16÷2＝8匹が亀。鶴は12匹。"}, {"q": "「兄が出発した5分後に、弟が自転車で追いかける。何分で追いつく？」はどの特殊算？", "o": ["つるかめ算", "旅人算", "植木算", "ニュートン算"], "a": 1, "e": "人が動いて追いついたり出会ったりする問題は旅人算。"}, {"q": "植木算で、道の両はしにも木を植えるとき、木の本数は？", "o": ["間の数と同じ", "間の数＋1", "間の数−1", "間の数×2"], "a": 1, "e": "両はしに植えると、木は「間の数＋1」本。両はしに植えないと「間の数−1」本。歌の「両端どうする」はここ。"}, {"q": "「濃度12％の食塩水」とはどういう意味？", "o": ["食塩水100gのうち食塩が12g", "水100gに食塩が12g", "食塩100gに水が12g", "食塩水12gに食塩が1g"], "a": 0, "e": "濃度は「食塩水全体」のうち食塩が何％か。水ではなく食塩水全体で考えるのがポイント。"}, {"q": "時計の長針と短針が重なるのは、1日に何回？", "o": ["12回", "22回", "24回", "11回"], "a": 1, "e": "12時間で11回重なるので、1日（24時間）では22回。歌にも「1日22回」とあったね。"}], "checked": true}, {"id": "keigo", "subj": "国語", "pub": "2026-10-18T11:58", "kind": "shorts", "title": "相手をあげて自分をさげる、それでも自己肯定感は大事です", "yt": "M08elvmrrwg", "th": "img/keigo_th.jpg", "bg": "img/keigo_bg.jpg", "qs": [{"q": "相手の動きを高くして言う敬語は？", "o": ["尊敬語", "謙譲語", "丁寧語", "方言"], "a": 0, "e": "相手をあげるのが尊敬語、自分をさげるのが謙譲語。歌のシーソーを思い出そう。"}, {"q": "「行く」の謙譲語は？", "o": ["いらっしゃる", "参る", "行かれる", "おいでになる"], "a": 1, "e": "自分が行くときは「参る」「伺う」。相手が行くときは「いらっしゃる」。"}, {"q": "「食べる」の尊敬語は？", "o": ["いただく", "召し上がる", "申し上げる", "拝見する"], "a": 1, "e": "相手が食べるなら「召し上がる」。自分が食べるなら「いただく」。"}, {"q": "外の人に、自分の母のことを言うとき正しいのは？", "o": ["母がおっしゃっていました", "母が申しておりました", "お母さんがおっしゃっていました", "母がお話しになりました"], "a": 1, "e": "身内のことは外ではさげる。だから謙譲語の「申す」。歌の「母が申しておりました」。"}, {"q": "尊敬語か謙譲語か迷ったら、まず何を見る？", "o": ["文の長さ", "主語（だれがするのか）", "漢字の数", "声の大きさ"], "a": 1, "e": "「その動きはだれのもの？」相手なら尊敬語、自分なら謙譲語。歌の「主語を見ろ、それだけでいい」。"}, {"q": "「言う」の尊敬語は？", "o": ["申し上げる", "おっしゃる", "申す", "言われます"], "a": 1, "e": "相手が言うなら「おっしゃる」。自分が言うなら「申し上げる」。"}, {"q": "「言う」の謙譲語は？", "o": ["おっしゃる", "申し上げる", "ご覧になる", "なさる"], "a": 1, "e": "自分が言うなら「申し上げる」「申す」。"}, {"q": "「見る」の尊敬語は？", "o": ["拝見する", "ご覧になる", "見られます", "お目にかかる"], "a": 1, "e": "相手が見るなら「ご覧になる」。「見てほしいときは ご覧ください」。"}, {"q": "「見る」の謙譲語は？", "o": ["ご覧になる", "拝見する", "いただく", "いたす"], "a": 1, "e": "自分が見るなら「拝見する」。"}, {"q": "「する」の尊敬語は？", "o": ["いたす", "なさる", "いただく", "参る"], "a": 1, "e": "相手がするなら「なさる」。自分がするなら「いたす」。"}, {"q": "「する」の謙譲語は？", "o": ["なさる", "いたす", "おっしゃる", "召し上がる"], "a": 1, "e": "自分がするなら「いたす」。"}, {"q": "「会う」の謙譲語は？", "o": ["お会いになる", "お目にかかる", "ご覧になる", "いらっしゃる"], "a": 1, "e": "自分が会うなら「お目にかかる」。相手が会うなら「お会いになる」。"}, {"q": "「知っている」の尊敬語は？", "o": ["存じている", "ご存じ", "拝見する", "申す"], "a": 1, "e": "相手が知っているなら「ご存じ」。自分なら「存じている」。"}, {"q": "「行く」の尊敬語は？", "o": ["参る", "伺う", "いらっしゃる", "いたす"], "a": 2, "e": "相手が行くなら「いらっしゃる」。自分なら「参る」「伺う」。"}, {"q": "「食べる」の謙譲語は？", "o": ["召し上がる", "いただく", "なさる", "拝見する"], "a": 1, "e": "自分が食べるなら「いただく」。相手なら「召し上がる」。"}, {"q": "「お待ちする」は、尊敬語と謙譲語のどっち？", "o": ["尊敬語", "謙譲語", "丁寧語", "方言"], "a": 1, "e": "「お待ちになる」は相手をあげる尊敬語、「お待ちする」は自分をさげる謙譲語。"}], "checked": true}, {"id": "kotoba", "subj": "国語", "pub": "2026-10-18T11:55", "kind": "normal", "title": "言葉があふれるその日まで", "yt": "6-oUgbsaHKM", "th": "img/kotoba_th.jpg", "bg": "img/kotoba_bg.jpg", "qs": [{"q": "記述で何も思いつかないとき、歌のおすすめは？", "o": ["白紙で出す", "へたでもいいから書く", "となりの人を見る", "先生に聞く"], "a": 1, "e": "白紙は0点確定。書けば部分点がつく。「書いた人から合格です」。"}, {"q": "歌の「3つのステップ」の順番は？", "o": ["だから→意見→なぜなら", "意見→なぜなら→だから", "なぜなら→だから→意見", "意見→だから→なぜなら"], "a": 1, "e": "意見（私はこう思う）→なぜなら（あった事）→だから（これからこうしたい）。この型で300字いける。"}, {"q": "経験をくわしく書くための「5つの質問」は？", "o": ["いつ・どこで・だれと・何があって・どう思ったか", "いつ・どこで・だれと・いくらで・なぜ", "だれが・なぜ・どうやって・いくつ・どこで", "いつ・どこで・何を・なぜ・どうやって"], "a": 0, "e": "いつ・どこで・だれと・何があって・どう思ったか。この5つを書けばくわしくなる。家族でごはんも、習いごとの失敗もネタになる。"}, {"q": "選択肢に「すべて」「必ず」「だけ」があったら？", "o": ["正解のことが多い", "あやしい（×のことが多い）", "関係ない", "問題がまちがっている"], "a": 1, "e": "言いすぎの言葉はあやしい。歌では「すべて・必ず・だけ、があったらバツ」。"}, {"q": "「会社につとめる」の漢字は？", "o": ["努める", "務める", "勤める", "勉める"], "a": 2, "e": "会社につとめるのは「勤める」。つとめるは3つある。"}, {"q": "「がんばってつとめる」の漢字は？", "o": ["努める", "務める", "勤める", "勉める"], "a": 0, "e": "努力の「努める」。歌のさいごは「私は合格に努めます」。"}, {"q": "「役目をつとめる」の漢字は？", "o": ["努める", "務める", "勤める", "勉める"], "a": 1, "e": "役目の「務める」。努力の努める・役目の務める・会社の勤める、で3つ。"}], "checked": true}, {"id": "control", "subj": "理科", "pub": "2026-10-20T15:00", "kind": "shorts", "title": "変えるのはひとつだけ", "yt": "PpdOXMX64Fc", "th": "img/control_th.jpg", "bg": "img/control_bg.jpg", "qs": [{"q": "実験で、1回に変えてよい条件はいくつ？", "o": ["1つ", "2つ", "3つ", "いくつでも"], "a": 0, "e": "変えるのはひとつだけ。ほかは全部そろえる。そうしないと何が効いたか分からない。"}, {"q": "比べるために、条件を変えずに置いておく実験を何という？", "o": ["コントロール", "チャレンジ", "サンプル", "リピート"], "a": 0, "e": "コントロール＝対照実験。「比べる相手がいないと、変わった理由は言えない」。"}, {"q": "「植物に水が必要か」を調べる実験。水以外の条件はどうする？", "o": ["光だけ同じにすればよい", "光・温度・土をすべて同じにする", "温度は変えてよい", "何も気にしなくてよい"], "a": 1, "e": "ちがうのは水だけ。光も温度も土も同じにする。"}, {"q": "水と光を同時に変えてしまったら？", "o": ["2倍はやく分かる", "どちらのせいか分からない", "光のせいと分かる", "水のせいと分かる"], "a": 1, "e": "「犯人が2人、決められない」。だから変えるのは1つだけ。"}, {"q": "歌のさいご、パンケーキで変えたものは？", "o": ["牛乳だけ", "小麦粉だけ", "卵だけ", "全部"], "a": 2, "e": "「今度は卵だけ変えた」→ ふわふわの理由がやっと分かった。"}], "checked": true}, {"id": "unicef", "subj": "社会", "pub": "2026-10-17T08:52", "kind": "shorts", "bg": "img/unicef_bg.jpg", "th": "img/unicef_th.jpg", "title": "ユニセフ ユネスコ どっちがどっち？", "tag": "社会・国際機関", "yt": "_OBJFJ7ZPzk", "qs": [{"q": "「こどもの命や教育を守る」ことに力を入れている国連の機関はどれ？", "o": ["ユニセフ", "ユネスコ", "WHO", "ODA"], "a": 0, "e": "ユニセフ（国連児童基金）は、世界の子どもを助ける機関。歌では「ユニセフは こども」だったね。"}, {"q": "世界遺産を決めている国連の機関はどれ？", "o": ["ユニセフ", "ユネスコ", "WHO", "ASEAN"], "a": 1, "e": "ユネスコは教育・科学・文化の機関。世界遺産の登録もユネスコの仕事。歌では「ユネスコは せかい いさん」。"}, {"q": "WHOは何をする機関？", "o": ["世界の貿易のルールを決める", "世界の健康・保健を守る", "世界の平和を見はる", "世界の海を調べる"], "a": 1, "e": "WHOは世界保健機関。病気をふせぐなど、世界の健康に取り組んでいるよ。"}, {"q": "日本の標準時の基準になっている経線は？また、その線が通る兵庫県の市は？", "o": ["東経135度・明石市", "東経135度・神戸市", "東経140度・明石市", "東経140度・姫路市"], "a": 0, "e": "日本は東経135度の経線を基準にしていて、兵庫県の明石市を通るよ。経度15度ごとに1時間ずれるので、ロンドン（0度）とは9時間の時差。"}, {"q": "SDGs（持続可能な開発目標）の目標の数はいくつ？", "o": ["8", "10", "17", "30"], "a": 2, "e": "SDGsは17の目標。2030年までに達成することをめざしているよ。"}], "checked": true}, {"id": "mama", "subj": "社会", "pub": "2026-10-15T01:01", "kind": "shorts", "bg": "img/mama_bg.jpg", "th": "img/mama_th.jpg", "title": "ママは常任理事国です", "tag": "社会・公民", "yt": "tA2PORvFI-8", "qs": [{"q": "三権分立で、法律をつくる「立法」を行うのはどこ？", "o": ["国会", "内閣", "裁判所", "都道府県"], "a": 0, "e": "立法＝国会、行政＝内閣、司法＝裁判所。権力をひとつに集めないために、3つに分けているんだよ。"}, {"q": "国連の安全保障理事会の常任理事国に入っていない国は？", "o": ["アメリカ", "フランス", "ドイツ", "中国"], "a": 2, "e": "常任理事国は、アメリカ・イギリス・フランス・ロシア・中国の5か国。ドイツは入っていないよ。"}, {"q": "安保理で、常任理事国が1か国でも反対するとどうなる？", "o": ["多数決で決まる", "決議が成立しない", "やり直しの選挙をする", "反対した国が退場する"], "a": 1, "e": "これが拒否権。歌の「ママの拒否権（発動！）」はこれのこと。「安保理より強い」わけだ。"}, {"q": "任期の途中で解散があるのはどれ？", "o": ["衆議院", "参議院", "両方ともある", "両方ともない"], "a": 0, "e": "衆議院は任期4年で解散あり。参議院は任期6年で解散はなく、3年ごとに半数が選び直されるよ。"}, {"q": "憲法改正を国会が発議するには、各議院でどれだけの賛成が必要？", "o": ["過半数", "3分の2以上", "4分の3以上", "全員一致"], "a": 1, "e": "各議院の総議員の3分の2以上。そのあと国民投票で、過半数の賛成があると改正されるよ。"}], "checked": true}, {"id": "uguisu", "subj": "社会", "pub": "2026-10-15T01:01", "kind": "shorts", "bg": "img/uguisu_bg.jpg", "th": "img/uguisu_th.jpg", "title": "鳴くなよウグイス、わたしが泣くよ", "tag": "社会・歴史（年号）", "yt": "MNAexKQjG_A", "qs": [{"q": "「鳴くよウグイス」。都が平安京に移ったのは何年？", "o": ["645年", "710年", "794年", "1192年"], "a": 2, "e": "794年に桓武天皇が都を平安京（京都）に移したよ。歌のさいごの答えも「794」だね。"}, {"q": "「虫殺す（645）」。この年に始まった政治の改革は？", "o": ["大化の改新", "応仁の乱", "明治維新", "遣唐使の廃止"], "a": 0, "e": "645年、中大兄皇子と中臣鎌足らが蘇我氏をたおして、大化の改新が始まったよ。"}, {"q": "「以後よさん（1543）」。この年に日本に伝わったものは？", "o": ["キリスト教", "鉄砲", "茶", "ペリーの黒船"], "a": 1, "e": "1543年、種子島に漂着したポルトガル人によって鉄砲が伝わったよ（鉄砲伝来）。"}, {"q": "「いちご（1582）パンツで本能寺」。本能寺の変で討たれた人は？", "o": ["豊臣秀吉", "徳川家康", "織田信長", "明智光秀"], "a": 2, "e": "1582年、織田信長が家臣の明智光秀におそわれて、本能寺で亡くなったよ。"}, {"q": "「いい国つくろう」の語呂で覚える、鎌倉幕府の成立年は？", "o": ["1185年", "1192年", "1221年", "1333年"], "a": 1, "e": "語呂は1192年。ただ、今は1185年ごろに成立したと考える説が主流で、歌のブリッジの「いい箱つくろう」はこちら。テストでは学校や問題集の書き方に合わせてね。"}, {"q": "遣唐使の停止は何年？", "o": ["1549年", "1853年", "894年", "1582年"], "a": 2, "e": "語呂は「白紙（894）にもどそう遣唐使」。"}, {"q": "応仁の乱は何年？", "o": ["645年", "1467年", "1603年", "1582年"], "a": 1, "e": "語呂は「人の世むなし（1467）応仁の乱」。"}, {"q": "キリスト教の伝来は何年？", "o": ["1853年", "1549年", "1603年", "645年"], "a": 1, "e": "語呂は「以後よく広まる（1549）キリスト教。ザビエルが伝えた」。"}, {"q": "江戸幕府の成立は何年？", "o": ["1543年", "1853年", "794年", "1603年"], "a": 3, "e": "語呂は「ひとむれさわぐ（1603）江戸幕府。徳川家康が開いた」。"}, {"q": "ペリーの来航は何年？", "o": ["1467年", "1853年", "894年", "794年"], "a": 1, "e": "語呂は「いやでござんす（1853）ペリーさん」。"}, {"q": "明治維新は何年？", "o": ["894年", "1868年", "1543年", "645年"], "a": 1, "e": "語呂は「いやろうや（1868）明治維新」。"}], "checked": true}, {"id": "kill", "subj": "勉強法", "pub": "2026-10-17T00:29", "kind": "normal", "title": "キルをとれたら、点とれますか？！", "yt": "7mVi4D_p7Sk", "th": "img/kill_th.jpg", "bg": "img/kill_bg.jpg", "qs": [{"q": "歌の主人公が「5分だけ休憩」のつもりで始めたものは？", "o": ["おやつ", "ゲーム", "マンガ", "昼寝"], "a": 1, "e": "右手にコントローラー、左手にえんぴつ。マッチング完了でもう止まらない。"}, {"q": "「ランクは上がった！」でも下がったものは？", "o": ["体重", "偏差値", "ゲームの点", "身長"], "a": 1, "e": "「ランクは上がった、偏差値は下がった」。キルは取れても点は取れない。"}, {"q": "「10キル0デス」の絶好調。でも算数はまだ何問目？", "o": ["1問目", "5問目", "10問目", "終わった"], "a": 0, "e": "「なのに算数まだ1問目」。エイムは完ぺき、計算はミスだらけ。"}, {"q": "明日あるのは？", "o": ["遠足", "組分けテスト", "運動会", "誕生日"], "a": 1, "e": "「ほんとうは分かってる、明日は組分けテスト」。でも指がはなれない…。"}, {"q": "歌のさいご「ママ これは休憩…」のあとに続く言葉は？", "o": ["です", "デス", "中", "じゃない"], "a": 1, "e": "「ママ これは休憩デス」。ゲームの「デス（やられること）」とかけているよ。"}], "checked": true}, {"id": "dopa", "subj": "勉強法", "pub": "2026-10-22T15:00", "kind": "shorts", "title": "勉強にドパれ‼", "yt": "0s2rPCYFhpw", "th": "img/dopa_th.jpg", "bg": "img/dopa_bg.jpg", "qs": [{"q": "問題が解けて「やった！」のとき、脳で出るこの歌の主役は？", "o": ["ドーパミン", "ビタミン", "カルシウム", "メラニン"], "a": 0, "e": "ドーパミンは「うれしい・もっとやりたい」を生む物質。マルがひとつでドパッ！"}, {"q": "勉強でドパるコツは？", "o": ["小さなゴールを細かく置く", "大きなゴールを1つだけ置く", "ゴールは置かずにひたすらやる", "ごほうびは全部終わってから"], "a": 0, "e": "「小さなゴールを細かく置いて、ひとつクリアでごほうびチャージ」。ゲームと同じしくみ。"}, {"q": "ドーパミンが出るのはいつ？", "o": ["解けたあとだけ", "あと少しで解けそうなワクワクのときにも出る", "ねているときだけ", "おこられたとき"], "a": 1, "e": "「ドパるのは解けたあとだけじゃない。あと少しで解けそうなワクワクのときにも出る」。"}, {"q": "テストでまちがえた問題は、どうするとドパれる？", "o": ["ノートに書いて、あとでもう1回解く", "見なかったことにする", "答えを写して終わりにする", "消しゴムで消す"], "a": 0, "e": "まちがいノートでリベンジ成功。それもコンボのうち。"}, {"q": "歌の中で「ドパ減少」になるのはどれ？", "o": ["過去問でまちがえた", "苦手単元をクリア", "模試で偏差値アップ", "リベンジ成功"], "a": 0, "e": "過去問まちがい・偏差値ダウン・親におこられ…でドパ減少。それでも「次のドパめざせ」。"}], "checked": true}, {"id": "uroko", "subj": "国語", "pub": "2026-10-28T16:00", "kind": "shorts", "title": "目から鱗が落ちるまで", "yt": "PFtLYnJO6Os", "th": "img/uroko_th.jpg", "bg": "img/uroko_bg.jpg", "qs": [{"q": "「顔が広い」の意味は？", "o": ["知り合いが多い", "顔が大きい", "有名である", "おこりっぽい"], "a": 0, "e": "知り合いが多いこと。歌では「かおがひろい（知り合いが多い）」。"}, {"q": "「猫の手も借りたい」の意味は？", "o": ["猫がすき", "とてもいそがしい", "手が小さい", "ひまである"], "a": 1, "e": "猫の手でも借りたいくらい、いそがしいということ。「宿題山もり時間がない」場面だね。"}, {"q": "「急がば回れ」の意味は？", "o": ["急ぐときは走れ", "近道より確実な道を行くほうがよい", "回り道はむだ", "急がなくてよい"], "a": 1, "e": "急ぐときこそ、あぶない近道より確実な道を行くほうが結局はやい。"}, {"q": "「二兎を追う者は一兎をも得ず」の意味は？", "o": ["うさぎは2ひき飼うとよい", "よくばると両方にがす", "2つ同時にやれば早い", "1つだけでは足りない"], "a": 1, "e": "2ひきのうさぎを同時に追うと1ぴきもつかまらない。よくばると両方にがす。"}, {"q": "「猿も木から落ちる」と同じ意味のことわざは？", "o": ["弘法も筆の誤り", "急がば回れ", "石の上にも三年", "塵も積もれば山となる"], "a": 0, "e": "名人でも失敗することがある。「弘法も筆の誤り」「河童の川流れ」も同じ意味。"}, {"q": "「耳が痛い」の意味は？", "o": ["よし、やると決める", "本当のことを言われてつらい", "今か今かと待つ", "歩きすぎてくたくた"], "a": 1, "e": "「耳が痛い」＝本当のことを言われてつらい。"}, {"q": "「鼻が高い」の意味は？", "o": ["知り合いが多い", "よし、やると決める", "ちょっと自まん", "本当のことを言われてつらい"], "a": 2, "e": "「鼻が高い」＝ちょっと自まん。"}, {"q": "「口がすべる」の意味は？", "o": ["歩きすぎてくたくた", "うっかり言ってしまう", "あつかいに困る", "とてもいそがしい"], "a": 1, "e": "「口がすべる」＝うっかり言ってしまう。"}, {"q": "「手を焼く」の意味は？", "o": ["ちょっと自まん", "うっかり言ってしまう", "あつかいに困る", "本当のことを言われてつらい"], "a": 2, "e": "「手を焼く」＝あつかいに困る。"}, {"q": "「足が棒になる」の意味は？", "o": ["今か今かと待つ", "本当のことを言われてつらい", "歩きすぎてくたくた", "うっかり言ってしまう"], "a": 2, "e": "「足が棒になる」＝歩きすぎてくたくた。"}, {"q": "「首を長くする」の意味は？", "o": ["知り合いが多い", "今か今かと待つ", "うっかり言ってしまう", "よし、やると決める"], "a": 1, "e": "「首を長くする」＝今か今かと待つ。"}, {"q": "「腹を決める」の意味は？", "o": ["今か今かと待つ", "うっかり言ってしまう", "知り合いが多い", "よし、やると決める"], "a": 3, "e": "「腹を決める」＝よし、やると決める。"}, {"q": "「石の上にも三年」の意味は？", "o": ["教わるより、やってみて身につける", "がまんすれば実をむすぶ", "小さなことも続ければ大きな成果になる", "近道より確実な道を行く"], "a": 1, "e": "「石の上にも三年」＝がまんすれば実をむすぶ。"}, {"q": "「塵も積もれば山となる」の意味は？", "o": ["大きなことも小さな一歩から始まる", "近道より確実な道を行く", "小さなことも続ければ大きな成果になる", "がんばったら、あとはあわてず待つ"], "a": 2, "e": "「塵も積もれば山となる」＝小さなことも続ければ大きな成果になる。"}, {"q": "「千里の道も一歩から」の意味は？", "o": ["がんばったら、あとはあわてず待つ", "近道より確実な道を行く", "大きなことも小さな一歩から始まる", "教わるより、やってみて身につける"], "a": 2, "e": "「千里の道も一歩から」＝大きなことも小さな一歩から始まる。"}, {"q": "「七転び八起き」の意味は？", "o": ["何度失敗しても立ち上がる", "教わるより、やってみて身につける", "がんばったら、あとはあわてず待つ", "よくばると両方にがす"], "a": 0, "e": "「七転び八起き」＝何度失敗しても立ち上がる。"}, {"q": "「習うより慣れろ」の意味は？", "o": ["がまんすれば実をむすぶ", "教わるより、やってみて身につける", "何度失敗しても立ち上がる", "近道より確実な道を行く"], "a": 1, "e": "「習うより慣れろ」＝教わるより、やってみて身につける。"}, {"q": "「果報は寝て待て」の意味は？", "o": ["大きなことも小さな一歩から始まる", "何度失敗しても立ち上がる", "がまんすれば実をむすぶ", "がんばったら、あとはあわてず待つ"], "a": 3, "e": "「果報は寝て待て」＝がんばったら、あとはあわてず待つ。"}], "checked": true}, {"id": "hantai", "subj": "国語", "pub": "2026-10-25T08:00", "kind": "normal", "title": "はじまりのはじまり、おわりのおわり", "yt": "6H_oZ5uxi6k", "th": "img/hantai_th.jpg", "bg": "img/hantai_bg.jpg", "qs": [{"q": "「原因」の対義語は？", "o": ["結果", "理由", "原点", "目的"], "a": 0, "e": "原因⇔結果。「宿題やらない原因ゲーム、結果は夜中のむりげータイム」。"}, {"q": "「具体」の対義語は？", "o": ["抽象", "現実", "理想", "客観"], "a": 0, "e": "具体⇔抽象。ほかに 理想⇔現実、主観⇔客観 もセットでおぼえよう。"}, {"q": "「需要」の対義語は？", "o": ["消費", "供給", "輸出", "支出"], "a": 1, "e": "需要⇔供給。生産⇔消費、収入⇔支出、輸入⇔輸出もいっしょに。"}, {"q": "「常識」の反対の言葉は？", "o": ["不常識", "無常識", "非常識", "未常識"], "a": 2, "e": "常識には「非」がつく。不安定・無関心・非常識・未完成。どれがつくかは1つずつおぼえる。"}, {"q": "「権利」の対義語は？", "o": ["義務", "責任", "自由", "法律"], "a": 0, "e": "権利⇔義務。片方おぼえたらもう片方。セットでおぼえて点数倍増。"}, {"q": "「理想」の対義語は？", "o": ["現実", "生産", "輸入", "消費"], "a": 0, "e": "理想⇔現実。セットでおぼえよう。"}, {"q": "「長所」の対義語は？", "o": ["短所", "失敗", "絶対", "受動"], "a": 0, "e": "長所⇔短所。セットでおぼえよう。"}, {"q": "「増加」の対義語は？", "o": ["減少", "短所", "消極", "長所"], "a": 0, "e": "増加⇔減少。セットでおぼえよう。"}, {"q": "「主観」の対義語は？", "o": ["悲観", "楽観", "客観", "偶然"], "a": 2, "e": "主観⇔客観。セットでおぼえよう。"}, {"q": "「積極」の対義語は？", "o": ["収入", "消極", "成功", "主観"], "a": 1, "e": "積極⇔消極。セットでおぼえよう。"}, {"q": "「肯定」の対義語は？", "o": ["短所", "否定", "長所", "失敗"], "a": 1, "e": "肯定⇔否定。セットでおぼえよう。"}, {"q": "「輸入」の対義語は？", "o": ["理想", "生産", "輸出", "短所"], "a": 2, "e": "輸入⇔輸出。セットでおぼえよう。"}, {"q": "「生産」の対義語は？", "o": ["客観", "増加", "楽観", "消費"], "a": 3, "e": "生産⇔消費。セットでおぼえよう。"}, {"q": "「収入」の対義語は？", "o": ["客観", "成功", "支出", "長所"], "a": 2, "e": "収入⇔支出。セットでおぼえよう。"}, {"q": "「能動」の対義語は？", "o": ["減少", "偶然", "理想", "受動"], "a": 3, "e": "能動⇔受動。セットでおぼえよう。"}, {"q": "「偶然」の対義語は？", "o": ["短所", "成功", "必然", "受動"], "a": 2, "e": "偶然⇔必然。セットでおぼえよう。"}, {"q": "「絶対」の対義語は？", "o": ["現実", "主観", "相対", "理想"], "a": 2, "e": "絶対⇔相対。セットでおぼえよう。"}, {"q": "「悲観」の対義語は？", "o": ["支出", "消費", "楽観", "理想"], "a": 2, "e": "悲観⇔楽観。セットでおぼえよう。"}, {"q": "「失敗」の対義語は？", "o": ["生産", "収入", "増加", "成功"], "a": 3, "e": "失敗⇔成功。セットでおぼえよう。"}, {"q": "「安定」の反対の言葉は？", "o": ["不安定", "無安定", "非安定", "未安定"], "a": 0, "e": "安定には「不」がつく。不安定・無関心・非常識・未完成。"}, {"q": "「関心」の反対の言葉は？", "o": ["不関心", "無関心", "非関心", "未関心"], "a": 1, "e": "関心には「無」がつく。不安定・無関心・非常識・未完成。"}, {"q": "「完成」の反対の言葉は？", "o": ["不完成", "無完成", "非完成", "未完成"], "a": 3, "e": "完成には「未」がつく。不安定・無関心・非常識・未完成。"}], "checked": true}, {"id": "kaisan", "subj": "社会", "pub": "2026-10-30T16:00", "kind": "normal", "title": "解散するから強いんです", "yt": "R7D1tbl_mzc", "th": "img/kaisan_th.jpg", "bg": "img/kaisan_bg.jpg", "qs": [{"q": "内閣総理大臣を指名するのはどこ？", "o": ["国民の投票", "国会", "天皇", "裁判所"], "a": 1, "e": "総理を決めるのは国民じゃなく国会。国会議員の中から、国会の議決で指名する。"}, {"q": "衆議院が参議院よ  "a": 1, "e": "いっしょに増えても原因とは限らない。本当の理由は「暑いから」。"}, {"q": "全体の中の割合を表すのに向いているグラフは？", "o": ["折れ線グラフ", "帯グラフや円グラフ", "棒グラフ", "ドットプロット"], "a": 1, "e": "折れ線は変化、棒は大きさ、帯と円は割合。"}], "checked": true}, {"id": "nazenara", "subj": "勉強法", "pub": "2026-10-26T16:00", "kind": "shorts", "title": "なぜなら病にかかりました。なぜなら、、、なぜなら、、、", "yt": "TKEnByyPvKc", "th": "img/nazenara_th.jpg", "bg": "img/nazenara_bg.jpg", "qs": [{"q": "この歌が伝えたいことは？", "o": ["理由を考える癖をつけよう", "早くねよう", "プリンを食べよう", "なぜならと言うと病気になる"], "a": 0, "e": "「なんでだろう」って考える癖を毎日つづければ、世界が見えてテストも解ける。"}, {"q": "「今日のプールは中止」なぜなら？", "free": true, "e": "歌では「なぜなら気温が低いから」。理由を考えて書けたら正解！"}, {"q": "「先生があくび」なぜなら？", "free": true, "e": "歌では「なぜなら今日は月曜日」。理由をひねり出せたら正解！"}, {"q": "「冷蔵庫をあける」なぜなら？", "free": true, "e": "歌では「プリンを食べたいから→ママが買ったから→…」。なぜならが続けば正解！"}, {"q": "ママの「早くねなさい」なぜなら？", "free": true, "e": "歌では「なぜなら、あしたも学校だから」。自分の理由が書けたら正解！"}], "checked": true}, {"id": "makura", "subj": "社会", "pub": "2026-10-24T08:00", "kind": "shorts", "title": "枕は清少、源氏は紫", "yt": "UyKKwt09TKE", "th": "img/makura_th.jpg", "bg": "img/makura_bg.jpg", "qs": [{"q": "『枕草子』の作者は？", "o": ["清少納言", "紫式部", "紀貫之", "兼好法師"], "a": 0, "e": "枕は清少納言！ 定子に仕えた。"}, {"q": "『源氏物語』の作者は？", "o": ["清少納言", "紫式部", "鴨長明", "藤原定家"], "a": 1, "e": "源氏は紫式部！ 彰子に仕えた。"}, {"q": "『古今和歌集』をまとめた中心の人物は？", "o": ["大伴家持", "紀貫之", "太安万侶", "後鳥羽上皇"], "a": 1, "e": "古今は紀貫之！ 905年、醍醐天皇の命令で。『土佐日記』も貫之。"}, {"q": "日本でいちばん古い歴史書は？", "o": ["古事記", "日本書紀", "風土記", "万葉集"], "a": 0, "e": "古事記（712年、太安万侶）が先で、日本書紀（720年、舎人親王）があと。"}, {"q": "三大随筆に入らないのは？", "o": ["枕草子", "方丈記", "徒然草", "竹取物語"], "a": 3, "e": "三大随筆は枕草子・方丈記・徒然草。竹取物語はいちばん古い物語。"}, {"q": "『日本書紀』（720年）をまとめた中心の人物は？", "o": ["舎人親王", "太安万侶", "大伴家持", "鴨長明"], "a": 0, "e": "日本書紀は720年、舎人親王。漢文で書いた国の歴史。"}, {"q": "『万葉集』をまとめたといわれる人は？", "o": ["紀貫之", "大伴家持", "藤原定家", "清少納言"], "a": 1, "e": "万葉集は歌がおよそ4500首。大伴家持がまとめたといわれ、万葉がなで大和言葉を書いた。"}, {"q": "いちばん古い物語といわれるのは？", "o": ["源氏物語", "平家物語", "竹取物語", "土佐日記"], "a": 2, "e": "竹取物語はいちばん古い物語。"}, {"q": "『土佐日記』を書いたのは？", "o": ["紫式部", "紀貫之", "兼好法師", "鴨長明"], "a": 1, "e": "土佐日記は紀貫之。女の  "「中京 愛知 自動車 日本一」。中京工業地帯は愛知県を中心に自動車づくりがさかん。"}, {"q": "千葉県にあり、石油化学がさかんな工業地域はどれ？", "o": ["京葉工業地域", "瀬戸内工業地域", "東海工業地域", "北陸工業地域"], "a": 0, "e": "「京葉 千葉は 石油化学」。京葉工業地域は千葉県の海ぞいにある。"}, {"q": "むかしは「四大工業地帯」の1つだったが、今は「工業地域」とよばれるのはどれ？", "o": ["京浜", "阪神", "中京", "北九州"], "a": 3, "e": "「北九州 むかしは四大だった いまは格下げ 工業地域」。"}, {"q": "さくらんぼの生産がさかんな県はどれ？", "o": ["青森県", "山梨県", "山形県", "和歌山県"], "a": 2, "e": "「さくらんぼ 山形」。りんごは青森、ぶどう・ももは山梨、みかんは和歌山。"}, {"q": "大阪府堺市にある、空から見るとかぎ穴の形をした日本一大きな古墳はどれ？", "o": ["石舞台古墳", "大仙古墳", "高松塚古墳", "五色塚古墳"], "a": 1, "e": "「大仙古墳 前方後円墳 空から見たら かぎ穴の形」。近くで見るとただの森。"}], "checked": true}, {"id": "kuma", "subj": "社会", "pub": "2026-11-02T16:30", "kind": "normal", "title": "クマった、ドングリがない・・・そうだスーパーへ行こう！", "yt": "l4U2s2FZ-sE", "th": "img/kuma_th.jpg", "bg": "img/kuma_bg.jpg", "qs": [{"q": "クマのえさになるブナの実が豊作になるのは、どのくらいに1度？", "o": ["毎年", "2〜3年に1度", "5〜7年に1度", "20年に1度"], "a": 2, "e": "「ブナが実るのは5年から7年に1度」。2025年の秋は大凶作だった。"}, {"q": "クマをつかまえる人（狩猟免許を持つ人）は、むかしの50万人から今はどのくらい？", "o": ["約40万人", "約20万人", "約5万人", "約100万人"], "a": 1, "e": "「つかまえる人は50万から20万 6割近くが60歳以上」。人が減って高齢化している。"}, {"q": "クマが奥山から町まで来やすくなった理由として、歌にあるものはどれ？", "o": ["道路が新しくできた", "里山の手入れがされず、やぶがのびて森がつながった", "山に雪が多くなった", "川が少なくなった"], "a": 1, "e": "「やぶがのびて 森がつながる 奥山から町まで 一本道」。人が減って里山が荒れたのが背景。"}, {"q": "緊急銃猟をするかどうかを決めるのはだれ？", "o": ["市町村長", "警察署長", "都道府県知事", "内閣総理大臣"], "a": 0, "e": "「いざというとき 緊急銃猟 決めるの市町村長」。2025年9月に始まった仕組み。"}, {"q": "クマを町に引き寄せないために、歌にある対策はどれ？", "o": ["柿をたくさん植える", "ごみを外に出しておく", "柿はとる・ごみはしまう・畑には電気柵", "山にえさをまく"], "a": 2, "e": "「柿はとる ごみはしまう 畑には電気柵」。やぶをかって境目をつくるすみ分け（ゾーニング）も対策。"}], "checked": true}, {"id": "nanbu", "subj": "社会", "pub": "2026-11-03T16:00", "kind": "shorts", "title": "鉄は南部、塗りは輪島", "yt": "lMKLNda6Wzc", "th": "img/nanbu_th.jpg", "bg": "img/nanbu_bg.jpg", "qs": [{"q": "南部鉄器の「南部」は何の名前？", "o": ["南のほうという意味", "むかしの殿さまの名前", "川の名前", "山の名前"], "a": 1, "e": "「南部は むかしの 殿さまの 名前 盛岡藩の 南部さん」。南部鉄器は岩手県。"}, {"q": "西陣織の「西陣」は、何のときに西軍が陣をしいた場所？", "o": ["関ヶ原の戦い", "壇ノ浦の戦い", "応仁の乱", "大阪の陣"], "a": 2, "e": "「応仁の乱で 西軍が 陣を しいた 場所」。戦がおわって機織りの町になった。西陣織は京都。"}, {"q": "有田焼のもう1つのよび名はどれ？", "o": ["九谷焼", "益子焼", "備前焼", "伊万里焼"], "a": 3, "e": "「伊万里の港から 船で出たから 伊万里焼とも 呼ばれます」。有田焼は佐賀県。"}, {"q": "輪島塗・九谷焼・加賀友禅がある県はどれ？", "o": ["石川県", "富山県", "福井県", "新潟県"], "a": 0, "e": "「九谷も 石川！ 友禅 石川！ 石川だけで みっつあります」。"}, {"q": "能登半島地震が起きたのはいつ？", "o": ["2011年3月11日", "2016年4月14日", "2024年1月1日", "1995年1月17日"], "a": 2, "e": "「能登半島地震 2024年1月1日」。輪島塗の能登では、地震のあとも職人さんが頑張っている。"}], "checked": true}, {"id": "uonzu", "subj": "社会", "pub": "2026-11-04T16:00", "kind": "shorts", "title": "雨温図、みんな同じ顔に見える", "yt": "leYDEKOyM9U", "th": "img/uonzu_th.jpg", "bg": "img/uonzu_bg.jpg", "qs": [{"q": "雨温図で、棒グラフと折れ線グラフはそれぞれ何を表す？", "o": ["棒が気温、線が雨", "棒が雨、線が気温", "棒が風、線が雨", "棒が雨、線が日照"], "a": 1, "e": "「棒が雨で 線が気温」。まずここから。"}, {"q": "冬に雨や雪が多い雨温図は、どの気候？", "o": ["太平洋側", "瀬戸内", "日本海側", "中央高地"], "a": 2, "e": "「冬に雨なら 日本海側！」。北西の季節風が日本海で水をすって、山にぶつかり雪がどっさり。"}, {"q": "冬でも気温が15度くらいある雨温図は、どの気候？", "o": ["北海道", "南西諸島", "中央高地", "日本海側"], "a": 1, "e": "「十五度！ 十五度！ 冬でも南西諸島！」。那覇が例。台風もくる。"}, {"q": "一年中雨が少なく、ため池が多い香川県があてはまる気候はどれ？", "o": ["瀬戸内", "太平洋側", "日本海側", "南西諸島"], "a": 0, "e": "「瀬戸内 山にはさまれ 一年中雨が少ない だから香川は ため池いっぱい」。"}, {"q": "雨が少なめで冬が寒く、夏と冬の気温の差が大きい雨温図はどの気候？", "o": ["南西諸島", "太平洋側", "瀬戸内", "中央高地（内陸）"], "a": 3, "e": "「内陸 中央高地 雨は少なめ 冬は寒い 夏と冬との 気温の差が大きい」。松本が例。"}], "checked": true}, {"id": "byo", "subj": "算数", "pub": "2026-11-05T16:00", "kind": "shorts", "title": "お母さん、ちょっとって何秒ですか", "yt": "H7WvUo2cMbs", "th": "img/byo_th.jpg", "bg": "img/byo_bg.jpg", "qs": [{"q": "1時間は何秒？", "o": ["600秒", "3600秒", "6000秒", "360秒"], "a": 1, "e": "「時間は60で くり上がる 1時間は 3600秒」。60秒×60分。"}, {"q": "ゾウの体重が約6トンのとき、キログラムで言うと？", "o": ["600kg", "60000kg", "6000kg", "60kg"], "a": 2, "e": "「ゾウの体重 約6トン 6000キロ キロとトンは 1000倍ずつ」。グラムで言うと600万グラム。"}, {"q": "2時間15分＋350秒−100分 は何秒？", "o": ["2450秒", "8100秒", "6000秒", "2350秒"], "a": 0, "e": "「ぜんぶ秒に直して 8100たす350 ひく6000 答えは2450秒」。分に直すと40分50秒。"}, {"q": "授業の45分は何秒？", "o": ["450秒", "2700秒", "4500秒", "900秒"], "a": 1, "e": "「授業の45分は 2700秒」。45×60で計算する。"}, {"q": "単位がバラバラの計算で、歌がすすめるやり方はどれ？", "o": ["大きい数から順に計算する", "いちばん大きい単位だけ使う", "そろえてから計算する", "そのまま足し引きする"], "a": 2, "e": "「単位をそろえて 計算すれば どんな時間も こわくない」。数字のうしろの単位を見て、そろえてから計算する。"}], "checked": true}, {"id": "hakaru", "subj": "国語", "pub": "2026-11-06T15:00", "kind": "shorts", "title": "あの子の気持ちは、どの『はかる』ではかればいいですか", "yt": "NAbOXoe7IGc", "th": "img/hakaru_th.jpg", "bg": "img/hakaru_bg.jpg", "qs": [{"q": "「プールの深さをはかる」の「はかる」は、どれ？", "o": ["計る", "測る", "量る", "図る"], "a": 1, "e": "長さと深さは「測」。ものさしやメジャーで測るイメージ。"}, {"q": "「100mのタイムをはかる」の「はかる」は、どれ？", "o": ["測る", "量る", "計る", "図る"], "a": 2, "e": "時間と数は「計」。ストップウォッチで計る。"}, {"q": "「問題の解決をはかる」の「はかる」は、どれ？", "o": ["図る", "計る", "測る", "量る"], "a": 0, "e": "工夫と計画は「図」。「解決を図る　作戦会議」。"}, {"q": "「学級委員をつとめる」の「つとめる」は、どれ？", "o": ["努める", "勤める", "務める", "収める"], "a": 2, "e": "役目をするなら「務」。「努める」は努力、「勤める」は会社で働くこと。"}, {"q": "「税金をおさめる」の「おさめる」は、どれ？", "o": ["収める", "治める", "修める", "納める"], "a": 3, "e": "「税金を納める　国にきちんと」。成果は収める、国は治める、学問は修める。"}], "checked": true}, {"id": "mamoru", "subj": "社会", "pub": "2026-11-07T08:00", "kind": "normal", "title": "守ってほしいけど、見ないでほしい", "yt": "1tmMJhQeN1s", "th": "img/mamoru_th.jpg", "bg": "img/mamoru_bg.jpg", "qs": [{"q": "「能動的サイバー防御」とは、どんな考え方？", "o": ["攻撃されてから守る", "攻撃が来るのを待たずに先回りして守る", "インターネットをぜんぶ止める", "外国にお願いして守ってもらう"], "a": 1, "e": "「来るのを待たずに先回り　それが能動的サイバー防御」。"}, {"q": "2023年にランサムウェアで約3日止まったのは、どこ？", "o": ["成田の空港", "東京の駅", "名古屋の港", "大阪の銀行"], "a": 2, "e": "2023年、名古屋の港でコンテナが約3日止まった。データを人質にお金を要求する攻撃だった。"}, {"q": "能動的サイバー防御の法律が成立した年と、主な部分がスタートした年は？", "o": ["2023年成立、2024年スタート", "2024年成立、2025年スタート", "2025年成立、2026年10月スタート", "2026年成立、2027年スタート"], "a": 2, "e": "「だから法律　2025年／2026年の10月スタート」。"}, {"q": "通信の情報を使うとき、見るのはどれ？", "o": ["メールや会話の中身", "IPアドレスなど（中身ではない）", "写真だけ", "パスワード"], "a": 1, "e": "「見るのは中身じゃなく　IPアドレス」。人ではなく機械が選び、いらないものはすぐ消す。"}, {"q": "「通信の秘密」を定めているのは、憲法の何条？", "o": ["第9条", "第14条", "第21条", "第25条"], "a": 2, "e": "「憲法21条　通信の秘密　手紙も電話も　のぞかれない約束」。安全と通信の秘密、両方から理由を書くのが記述のコツ。"}], "checked": true}, {"id": "jomon", "subj": "社会", "pub": "2026-11-08T08:00", "kind": "shorts", "title": "縄文発・令和行き、各駅停車です", "yt"     <div class="tools"><input type="search" id="search" placeholder="曲名でさがす" value="${esc(query)}" aria-label="曲名でさがす"><button class="sort" id="sort"></button></div>
    <div id="list"></div>`;
  $("#search").oninput=e=>{query=e.target.value;drawList()};
  $("#sort").onclick=()=>{desc=!desc;drawList()};
  drawList();
}
function drawList(){
  const d=done(), q=query.trim();
  const LS=live();
  const cleared=LS.filter(s=>d[s.id]===100).length, pct=LS.length?Math.round(cleared/LS.length*100):0;
  const bi=$("#bannerimg"),bsrc=BANNERS[bannerStage(pct)];if(bi&&bi.src!==bsrc)bi.src=bsrc;
  $("#prog").innerHTML=`<span class="proglabel">クリア率</span><div class="progbar"><i style="width:${pct}%"><b>${pct}%</b></i></div>`;
  const all=[...new Set(LS.map(s=>s.subj))].sort((a,b)=>(ORDER.indexOf(a)+1||99)-(ORDER.indexOf(b)+1||99));
  const ALL="すべて"; if(subj!==ALL&&!all.includes(subj))subj=ALL;
  $("#subjects").innerHTML=[ALL,...all].map(x=>`<button class="sbtn" data-s="${esc(x)}" aria-pressed="${x===subj}">${esc(x)}<small>${x===ALL?LS.length:LS.filter(s=>s.subj===x).length}</small></button>`).join("");
  document.querySelectorAll(".sbtn").forEach(b=>b.onclick=()=>{subj=b.dataset.s;drawList()});
  $("#sort").textContent=desc?"公開日 ↓ 新しい順":"公開日 ↑ 古い順";
  const songs=LS.filter(s=>q?s.title.includes(q):(subj===ALL||s.subj===subj))
    .map((s,i)=>[s,i]).sort((a,b)=>{const c=(a[0].pub||"").localeCompare(b[0].pub||"");return (c||a[1]-b[1])*(desc?-1:1)}).map(x=>x[0]);
  $("#list").innerHTML=songs.length?`<ul class="rows">${
    songs.map(s=>`<li><button class="row" data-id="${s.id}" aria-label="${esc(s.title)}"><img class="th" src="${s.th}" alt="">${isNew(s)?`<span class="newtag">新着</span>`:""}${d[s.id]!=null?`<span class="m${d[s.id]===100?" full":""}">${d[s.id]}点</span>`:""}</button></li>`).join("")
  }</ul>`:(q?`<p class="muted">見つかりません。</p>`:"");
  document.querySelectorAll(".row").forEach(b=>b.onclick=()=>startSong(b.dataset.id));
}

/* ---- ドーパミン ---- */
const DPSAY=["正解！","おめでとう！","やった！","どぱっ！"], NGSAY=["ざんねん…","おしい…","しゅん…","もう1回…"];
const DP_OK=$("#dpimg").src, DP_NG="dp/ng.png";
let dpTimer=null;
function dopa(ok){const d=$("#dp"),L=ok?DPSAY:NGSAY;$("#dpimg").src=ok?DP_OK:DP_NG;$("#dpsay").textContent=L[Math.floor(Math.random()*L.length)];d.classList.toggle("ng",!ok);d.classList.add("show");clearTimeout(dpTimer);dpTimer=setTimeout(()=>d.classList.remove("show"),2200)}
/* ---- クイズ ---- */
function startSong(id){
  cur=SONGS.find(s=>s.id===id);
  $("#bg").style.backgroundImage=`url(${cur.bg})`;
  st={i:0,res:[],picked:null,qs:cur.qs.map(q=>build(q,cur))};
  render();
}
function topbar(){
  const right=`<a class="yt" href="${ytUrl(cur)}" target="_blank" rel="noopener">▶ 曲を聞く</a>`;
  return `<div class="bar"><button class="back" id="back">← もどる</button>${right}</div><div class="songhead panel"><p class="songname">${esc(cur.title)}</p></div>`;
}
function render(){
  const t=st.qs.length;
  if(st.i>=t){
    const n=st.res.filter(Boolean).length, pt=Math.round(n/t*100);
    saveDone(cur.id,pt);recordResult(cur.id,pt);
    const msg=n===t?"ぜんぶ正解！":n>=t-1?"あとちょっと！":"もう1回ちょうせんしよう。";
    app.innerHTML=topbar()+`<div class="panel"><div class="score">${pt}<small> 点（100点満点）</small></div><p>${msg}</p>
      <div class="actions"><button class="next" id="again">もう1回やる</button><button class="ghost" id="other">ホームに戻る</button></div></div>`;
    $("#again").onclick=()=>startSong(cur.id);
    $("#other").onclick=showList;
    $("#back").onclick=showList;
    return;
  }
  const q=st.qs[st.i], dn=st.picked!==null;
  if(q.free){
    // 自由記入：何か書けば正解
    const fb=dn?`<div class="fb"><h3>正解！とにかく書くのが大事！</h3><p>${esc(q.e)}</p></div>
      <button class="next" id="nx">${st.i+1<t?"つぎの問題へ":"けっかを見る"}</button>`:`<button class="next" id="ans">答える</button>`;
    app.innerHTML=topbar()+`<div class="panel"><p class="label">${st.i+1}/${t}問</p><p class="q">${esc(q.q)}</p><textarea class="free" id="free" rows="3" placeholder="なぜなら…" ${dn?"disabled":""}>${esc(st.text||"")}</textarea>${fb}</div>`;
    $("#back").onclick=showList;
    const ta=$("#free"),an=$("#ans");
    if(an){an.disabled=!ta.value.trim();ta.oninput=()=>{an.disabled=!ta.value.trim()};
      an.onclick=()=>{st.text=ta.value;st.picked=1;st.res[st.i]=true;render();dopa(true);const f=$(".fb");f&&f.scrollIntoView({block:"nearest",behavior:"smooth"})}}
    const nx=$("#nx");if(nx)nx.onclick=()=>{st.i++;st.picked=null;st.text="";render()};
    return;
  }
  const ok=st.picked===q.a;
  const opts=q.o.map((x,k)=>{
    let c="opt",m="";
    if(dn){if(k===q.a){c+=" right";m='<span class="mark" aria-hidden="true">○</span>'}else if(k===st.picked){c+=" wrong";m='<span class="mark" aria-hidden="true">×</span>'}}
    return `<li><button class="${c}" data-k="${k}" ${dn?"disabled":""} aria-label="${esc(x)}">${q.oi?q.oi[k]:`<span>${esc(x)}</span>`}${m}</button></li>`}).join("");
  const fb=dn?`<div class="fb ${ok?'':'ng'}"><h3>${ok?"正解！":"ざんねん。正解は「"+esc(q.o[q.a])+"」"}</h3><p>${esc(q.e)}</p></div>
    <button class="next" id="nx">${st.i+1<t?"つぎの問題へ":"けっかを見る"}</button>`:"";
  app.innerHTML=topbar()+`<div class="panel"><p class="label">${st.i+1}/${t}問</p><p class="q">${esc(q.q)}${q.qi||""}</p><ul class="opts">${opts}</ul>${fb}</div>`;
  $("#back").onclick=showList;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{st.picked=+b.dataset.k;st.res[st.i]=st.picked===q.a;render();dopa(st.res[st.i]);const f=$(".fb");f&&f.scrollIntoView({block:"nearest",behavior:"smooth"})});
  const nx=$("#nx");if(nx)nx.onclick=()=>{st.i++;st.picked=null;render()};
}
showList();
</script>
</body></html>
